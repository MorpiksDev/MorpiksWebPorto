             points="424,245 410,306 362,315">
      <title>Tail Upper Curve Outer (#tail-shard-03)</title>
    </polygon>
    <polygon id="tail-shard-04" 
             class="shard shard-tail" 
             data-name="Tail Mid Curve Outer"
             data-group="tail"
             data-cx="372" 
