<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 547 456" 
     width="100%" 
     height="100%"
     class="chameleon-emblem"
     id="chameleon-svg"
     aria-label="Low-Poly Chameleon Emblem">
  
  <defs>
    <style>
      :root {
        --chameleon-color: #111827;
        --chameleon-hover: #059669;
        --chameleon-eye-sclera: #ffffff;
        --chameleon-eye-pupil: #111827;
      }
      .shard {
        fill: var(--chameleon-color);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                    fill 0.25s ease, 
                    filter 0.25s ease;
        transform-origin: center;
        cursor: pointer;
      }
      .shard:hover {
        fill: var(--chameleon-hover);
        filter: drop-shadow(0 4ms 10px rgba(5, 150, 105, 0.4));
      }
      .eye-sclera {
        fill: var(--chameleon-eye-sclera);
        transition: transform 0.2s ease;
      }
      .eye-pupil {
        fill: var(--chameleon-eye-pupil);
        transition: transform 0.15s ease;
      }
      #eye {
        cursor: pointer;
        transform-origin: 128px 139.5px;
      }
    </style>
  </defs>

  <!-- ================= CREST GROUP ================= -->
  <g id="crest" class="chameleon-group group-crest">
    <polygon id="crest-shard-1" 
             class="shard shard-crest" 
             data-name="Crest Top Spike"
             data-group="crest"
             data-cx="185" 
             data-cy="87"
             points="210,53 206,117 139,93">
      <title>Crest Top Spike (#crest-shard-1)</title>
    </polygon>
  </g>

  <!-- ================= HEAD GROUP ================= -->
  <g id="head" class="chameleon-group group-head">
    <polygon id="head-face" 
             class="shard shard-head" 
             data-name="Face & Eye Socket"
             data-group="head"
             data-cx="123" 
             data-cy="139"
             points="135,97 150,150 87,168">
      <title>Face & Eye Socket (#head-face)</title>
    </polygon>
    <!-- Chameleon Layered Eye Structure (independent animatable elements) -->
    <g id="eye" class="chameleon-eye" data-name="Chameleon Eye" data-group="head">
      <circle id="eye-sclera" class="eye-sclera" cx="128" cy="139.5" r="9.8">
        <title>Eye Sclera</title>
      </circle>
      <circle id="eye-pupil" class="eye-pupil" cx="127.0" cy="139.5" r="4.4">
        <title>Eye Pupil</title>
      </circle>
    </g>
    <polygon id="head-temple" 
             class="shard shard-head" 
             data-name="Temple & Crown"
             data-group="head"
             data-cx="206" 
             data-cy="136"
             points="220,111 253,145 159,145">
      <title>Temple & Crown (#head-temple)</title>
    </polygon>
    <polygon id="head-snout" 
             class="shard shard-head" 
             data-name="Snout & Nose"
             data-group="head"
             data-cx="108" 
             data-cy="181"
             points="136,159 97,204 104,205 96,205 87,175">
      <title>Snout & Nose (#head-snout)</title>
    </polygon>
    <polygon id="head-jaw" 
             class="shard shard-head" 
             data-name="Lower Jaw"
             data-group="head"
             data-cx="142" 
             data-cy="198"
             points="165,181 177,202 104,204">
      <title>Lower Jaw (#head-jaw)</title>
    </polygon>
  </g>

  <!-- ================= BODY GROUP ================= -->
  <g id="body" class="chameleon-group group-body">
    <polygon id="body-spine-upper" 
             class="shard shard-body" 
             data-name="Upper Spine Ridge"
             data-group="body"
             data-cx="269" 
             data-cy="116"
             points="303,94 272,154 229,108">
      <title>Upper Spine Ridge (#body-spine-upper)</title>
    </polygon>
    <polygon id="body-shoulder" 
             class="shard shard-body" 
             data-name="Shoulder Plate"
             data-group="body"
             data-cx="347" 
             data-cy="145"
             points="316,96 388,142 348,200">
      <title>Shoulder Plate (#body-shoulder)</title>
    </polygon>
    <polygon id="body-flank-upper" 
             class="shard shard-body" 
             data-name="Upper Flank"
             data-group="body"
             data-cx="289" 
             data-cy="181"
             points="254,146 327,188 304,218 299,209 285,204 287,198">
      <title>Upper Flank (#body-flank-upper)</title>
    </polygon>
    <polygon id="body-chest" 
             class="shard shard-body" 
             data-name="Chest & Throat"
             data-group="body"
             data-cx="189" 
             data-cy="175"
             points="232,176 205,204 188,204 150,151">
      <title>Chest & Throat (#body-chest)</title>
    </polygon>
    <polygon id="body-spine-mid" 
