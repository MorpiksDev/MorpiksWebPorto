    </polygon>
    <polygon id="tail-shard-05" 
             class="shard shard-tail" 
             data-name="Tail Mid Curve Inner"
             data-group="tail"
             data-cx="334" 
             data-cy="348"
             points="347,318 347,372 305,354">
      <title>Tail Mid Curve Inner (#tail-shard-05)</title>
    </polygon>
    <polygon id="tail-shard-06" 
             class="shard shard-tail" 
             data-name="Tail Lower Bend Outer"
             data-group="tail"
             data-cx="303" 
             data-cy="386"
             points="304,362 343,379 266,408">
      <title>Tail Lower Bend Outer (#tail-shard-06)</title>
    </polygon>
    <polygon id="tail-shard-07" 
             class="shard shard-tail" 
             data-name="Tail Lower Bend Inner"
             data-group="tail"
             data-cx="264" 
             data-cy="374"
             points="298,357 260,404 229,370">
      <title>Tail Lower Bend Inner (#tail-shard-07)</title>
    </polygon>
    <polygon id="tail-shard-08" 
             class="shard shard-tail" 
             data-name="Tail Coil Bottom Outer"
             data-group="tail"
             data-cx="221" 
             data-cy="388"
             points="219,369 254,408 187,381">
      <title>Tail Coil Bottom Outer (#tail-shard-08)</title>
    </polygon>
    <polygon id="tail-shard-09" 
             class="shard shard-tail" 
             data-name="Tail Coil Ascending Inner"
             data-group="tail"
             data-cx="195" 
             data-cy="365"
             points="192,353 213,364 181,377">
      <title>Tail Coil Ascending Inner (#tail-shard-09)</title>
    </polygon>
    <polygon id="tail-shard-10" 
             class="shard shard-tail" 
             data-name="Tail Tip Spike"
             data-group="tail"
             data-cx="159" 
             data-cy="343"
             points="127,315 187,349 175,375">
      <title>Tail Tip Spike (#tail-shard-10)</title>
    </polygon>
  </g>

</svg>
