             data-name="Mid Spine Wedge"
             data-group="body"
             data-cx="396" 
             data-cy="191"
             points="393,150 423,226 363,194">
      <title>Mid Spine Wedge (#body-spine-mid)</title>
    </polygon>
    <polygon id="body-flank-lower" 
             class="shard shard-body" 
             data-name="Lower Flank"
             data-group="body"
             data-cx="250" 
             data-cy="198"
             points="237,179 285,201 269,205 215,204">
      <title>Lower Flank (#body-flank-lower)</title>
    </polygon>
    <polygon id="body-hip" 
             class="shard shard-body" 
             data-name="Hip & Pelvis"
             data-group="body"
             data-cx="339" 
             data-cy="221"
             points="332,192 347,201 359,249 313,220">
      <title>Hip & Pelvis (#body-hip)</title>
    </polygon>
  </g>

  <!-- ================= FRONT LEG GROUP ================= -->
  <g id="front-leg" class="chameleon-group group-front-leg">
    <polygon id="front-leg-limb" 
             class="shard shard-front-leg" 
             data-name="Front Forelimb & Foot"
             data-group="front-leg"
             data-cx="171" 
             data-cy="230"
             points="178,204 184,211 199,211 171,250 142,250">
      <title>Front Forelimb & Foot (#front-leg-limb)</title>
    </polygon>
  </g>

  <!-- ================= BACK LEG GROUP ================= -->
  <g id="back-leg" class="chameleon-group group-back-leg">
    <polygon id="back-leg-limb" 
             class="shard shard-back-leg" 
             data-name="Hind Limb & Foot"
             data-group="back-leg"
             data-cx="277" 
             data-cy="232"
             points="284,208 303,219 279,249 250,249">
      <title>Hind Limb & Foot (#back-leg-limb)</title>
    </polygon>
  </g>

  <!-- ================= TAIL GROUP ================= -->
  <g id="tail" class="chameleon-group group-tail">
    <polygon id="tail-shard-01" 
